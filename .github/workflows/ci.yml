name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AiMentor.slnx

      - name: Build (warnings as errors)
        run: dotnet build AiMentor.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test --project tests/AiMentor.UnitTests/AiMentor.UnitTests.csproj -c Release --no-build

      # Integration tests (Testcontainers), coverage, test-set validation and image build are added in P7-T2.
      - name: Integration tests
        run: dotnet test --project tests/AiMentor.IntegrationTests/AiMentor.IntegrationTests.csproj -c Release --no-build
